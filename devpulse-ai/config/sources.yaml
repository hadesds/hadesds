    category: desenvolvimento
    priority_tier: 1
    reliability: 0.95
  - slug: typescript-blog
    name: TypeScript Blog (Microsoft)
    connector_type: rss
    url: https://devblogs.microsoft.com/typescript/feed/
    category: desenvolvimento
    priority_tier: 1
    reliability: 0.95
  - slug: dotnet-blog
    name: .NET Blog (Microsoft)
    connector_type: rss
    url: https://devblogs.microsoft.com/dotnet/feed/
    category: desenvolvimento
    priority_tier: 1
    reliability: 0.95
  - slug: rust-blog
    name: Rust Blog
    connector_type: rss
    url: https://blog.rust-lang.org/feed.xml
    category: desenvolvimento
    priority_tier: 1
    reliability: 0.95
  - slug: go-blog
    name: The Go Blog
    connector_type: rss
    url: https://go.dev/blog/feed.atom
    category: desenvolvimento
    priority_tier: 1
    reliability: 0.95
  - slug: react-blog
    name: React Blog
    connector_type: rss
    url: https://react.dev/rss.xml
    category: desenvolvimento
    priority_tier: 1
    reliability: 0.95
  - slug: kubernetes-blog
    name: Kubernetes Blog
