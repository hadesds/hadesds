  # --- Repositórios oficiais e changelogs ---
  - slug: gh-nextjs
    name: Next.js releases
    connector_type: github_releases
    config: {repo: vercel/next.js, max_items: 3}
    category: desenvolvimento
    priority_tier: 2
    reliability: 0.95
    fetch_interval_minutes: 240
  - slug: gh-fastapi
    name: FastAPI releases
    connector_type: github_releases
    config: {repo: fastapi/fastapi, max_items: 3}
    category: desenvolvimento
    priority_tier: 2
    reliability: 0.95
    fetch_interval_minutes: 240
  - slug: gh-typescript
    name: TypeScript releases
    connector_type: github_releases
    config: {repo: microsoft/TypeScript, max_items: 3}
    category: desenvolvimento
    priority_tier: 2
    reliability: 0.95
    fetch_interval_minutes: 240

  # --- APIs públicas ---
  - slug: cisa-kev
    name: CISA Known Exploited Vulnerabilities
    connector_type: json_api
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    config: {preset: cisa_kev, max_items: 15, max_age_days: 5}
    category: seguranca
    priority_tier: 1
    reliability: 1.0
    fetch_interval_minutes: 360
  - slug: hackernews-front
    name: Hacker News (página inicial)
    connector_type: json_api
    url: https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=40
    config: {preset: hackernews, min_points: 80, max_items: 40}
    priority_tier: 5
    reliability: 0.5
    notes: Agregador — sinal de interesse do público; nunca confirma um fato sozinho.

  # --- Portais especializados (contextualização e confirmação independente) ---
