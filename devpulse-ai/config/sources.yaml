# Fontes iniciais do DevPulse AI.
#
# Este arquivo é lido por `devpulse init`/`devpulse seed` e só CRIA fontes novas
# (pelo `slug`); alterações feitas depois no painel não são sobrescritas.
# Para incluir uma fonte, adicione um bloco aqui ou use a tela "Fontes" do painel.
#
# priority_tier: 1 = anúncio oficial/documentação · 2 = repositório/changelog oficial
#                3 = newsletter · 4 = portal especializado · 5 = independente/agregador
# categorias: desenvolvimento | ia | infraestrutura | seguranca | mercado
#
# "verificado": a URL respondeu a partir do ambiente onde o projeto foi desenvolvido.
# As demais são endereços públicos conhecidos; o DevPulse registra falhas na
# primeira coleta caso alguma tenha mudado. Nenhuma fonte é considerada válida sem coleta real.

sources:
  # --- Newsletter (primeira fonte de interesse) ---
  - slug: techdrops
    name: TechDrops (newsletter)
    connector_type: email_newsletter
    config:
      sender: tech@newsletter.thedrops.com.br   # REMETENTE da newsletter
      lookback_days: 3
      max_messages: 5
    category: desenvolvimento
    priority_tier: 3
    reliability: 0.7
    fetch_interval_minutes: 120
    notes: >
      Lida da caixa configurada em NEWSLETTER_MAILBOX_* (.env). Não há API pública conhecida;
      o conteúdo não é presumido acessível na web. Cada link citado é aberto e verificado na fonte original.

  # --- Anúncios oficiais ---
  - slug: docker-blog
    name: Docker Blog
    connector_type: rss
    url: https://www.docker.com/blog/feed/
    category: infraestrutura
    priority_tier: 1
    reliability: 0.95
    notes: >
      Feed público; no ambiente de desenvolvimento respondeu a curl mas recusou (HTTP 403) o cliente
      HTTP do DevPulse. O sistema registra a recusa e não tenta contorná-la.
  - slug: nodejs-blog
    name: Node.js Blog
    connector_type: rss
    url: https://nodejs.org/en/feed/blog.xml
    category: desenvolvimento
    priority_tier: 1
    reliability: 0.95
    notes: verificado
  - slug: anthropic-news
    name: Anthropic News
    connector_type: webpage
    url: https://www.anthropic.com/news
    config:
      link_pattern: "^/news/[a-z0-9-]+$"
      exclude_pattern: "^/news/(announcements|partnerships|policy|product|societal-impacts)$"
      max_items: 15
    category: ia
    priority_tier: 1
    reliability: 0.95
    fetch_interval_minutes: 180
    notes: verificado (página sem RSS; datas vêm dos metadados de cada artigo)
  - slug: openai-news
    name: OpenAI News
    connector_type: rss
    url: https://openai.com/news/rss.xml
    category: ia
    priority_tier: 1
    reliability: 0.95
  - slug: github-blog
    name: GitHub Blog
    connector_type: rss
    url: https://github.blog/feed/
    category: desenvolvimento
    priority_tier: 1
    reliability: 0.95
  - slug: github-changelog
