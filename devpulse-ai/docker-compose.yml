# DevPulse AI — execução local com Docker Desktop (Windows + WSL2) ou Docker Engine (Linux).
# Todas as portas ficam presas a 127.0.0.1: nada é exposto à rede local ou à internet.
name: devpulse

x-app: &app
  build: .
  image: devpulse-ai:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devpulse}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-devpulse}
    SOURCES_FILE: /app/config/sources.yaml
    FRONTEND_DIST: /app/frontend_dist
  volumes:
    - ./config:/app/config:ro
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-devpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # só para depuração local (psql)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devpulse} -d ${POSTGRES_DB:-devpulse}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "devpulse.cli", "init"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "devpulse.cli", "worker"]
    stop_grace_period: 60s

volumes:
  pgdata:
